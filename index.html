<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sales Desk">
<meta name="theme-color" content="#131828">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Sales Desk</title>
<style>
:root {
  /* Midnight: deep blue underneath (not black), soft lighter cards, light text. Indigo-to-violet for hero cards and buttons,
     gold for wins, fresh teal for money. --deep is the heading colour, --fill the buttons. */
  color-scheme: dark;
  --deep: #eef1f8; --emerald: #5fd4b8; --mint: #dbe0ff; --gold: #f5c25c; --gold-light: #ffe099;
  --cream: #131828; --peach: rgba(245,194,92,.10); --plum: #b8a1ff; --ink: #e3e7f1; --muted: #9aa3b8;
  --card: #20263c; --line: rgba(255,255,255,.08); --orange: #ffad5c; --fill: linear-gradient(135deg, #3b40a0, #7350c7);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font-family: -apple-system, "SF Pro Text", "Heebo", system-ui, sans-serif; color: var(--ink);
  background: var(--cream); min-height: 100dvh; overflow-x: hidden;
  padding: calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 96px);
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(var(--cream), var(--cream)) top / 100% calc(env(safe-area-inset-top) + 8px) no-repeat,
              radial-gradient(60% 40% at 100% 18%, rgba(102,102,242,.24), transparent 70%),
              radial-gradient(55% 38% at 0% 26%, var(--peach), transparent 70%),
              radial-gradient(60% 40% at 40% 100%, rgba(158,102,242,.14), transparent 70%);
}
.num { font-family: ui-rounded, -apple-system, system-ui; font-variant-numeric: tabular-nums; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
header > div:first-child { min-width: 0; }
h1 { font-size: 22px; line-height: 1.15; margin: 0; color: var(--deep); font-weight: 800; letter-spacing: -.3px; }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.tools { display: flex; gap: 7px; align-items: center; flex: none; }
.icon { border: 0; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #3b40a0, #7350c7); color: #fff; border: 1px solid rgba(255,255,255,.08); display: grid; place-items: center; padding: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.07); flex: none; }
.icon svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.icon:active { transform: scale(.94); }
.icon.spin svg { animation: spin .9s linear infinite; color: var(--emerald); }
@keyframes spin { to { transform: rotate(360deg); } }
.find { position: fixed; inset: 0; z-index: 6; background: rgba(5,8,18,.6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.find .panel { background: var(--cream); padding: calc(env(safe-area-inset-top) + 14px) 16px 14px; border-radius: 0 0 22px 22px; max-height: calc(var(--vh, 100dvh) - 24px); display: flex; flex-direction: column; }
.find .findbar { display: flex; gap: 10px; align-items: center; }
.find input { flex: 1; min-width: 0; border: 0; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 14px; background: var(--card); box-shadow: 0 2px 8px rgba(255,255,255,.06); }
.find .cancel { border: 0; background: none; font: inherit; font-weight: 700; color: var(--emerald); font-size: 16px; padding: 6px 2px; }
.find .results { overflow-y: auto; margin-top: 12px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.find .results::-webkit-scrollbar { display: none; }
body.locked { position: fixed; left: 0; right: 0; overflow: hidden; }
.find .hint { color: var(--muted); font-size: 14px; padding: 6px 2px; }
.faceAsk button#enableFace2 { border: 0; font: inherit; font-weight: 700; padding: 9px 16px; border-radius: 12px; background: var(--fill); color: var(--gold-light); }
.faceAsk .later { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; margin-top: 6px; padding: 0; }
select.month {
  appearance: none; -webkit-appearance: none; border: 0; font: inherit; font-weight: 700; font-size: 15px; color: var(--deep);
  background: var(--card); padding: 10px 12px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.07); direction: rtl;
}
.card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(255,255,255,.06); }
.dark { background: linear-gradient(135deg, #3b40a0, #7350c7); border: 1px solid rgba(255,255,255,.06); color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.2); display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.dark .ttl { font-size: 16px; font-weight: 600; opacity: .9; }
.dark .v { font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-top: 6px; }
.delta { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); color: var(--mint); font-weight: 700; padding: 8px 11px; border-radius: 12px; white-space: nowrap; font-size: 16px; direction: ltr; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 .card, .grid3 .card { margin: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
.label { color: var(--muted); font-size: 13px; font-weight: 500; }
.big { font-size: 25px; font-weight: 800; color: var(--deep); margin: 2px 0; }
.big.em { color: var(--emerald); } .big.gold { color: var(--gold); }
.mid { font-size: 19px; font-weight: 700; color: var(--deep); }
.small { font-size: 12px; color: var(--muted); }
.bar { height: 6px; border-radius: 999px; background: rgba(95,212,184,.14); overflow: hidden; margin: 8px 0 6px; }
.bar.thin { height: 5px; margin: 4px 0 0; }
.bar.thin i { background: rgba(95,212,184,.8); }
.bar.onDark { background: rgba(255,255,255,.14); }
.card.dark .sub { font-size: 12.5px; color: rgba(255,255,255,.75); }
.chipw { font-size: 12px; font-weight: 700; color: #c7eedb; background: rgba(255,255,255,.09); padding: 4px 9px; border-radius: 999px; }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #cc9e38, #fadb8c); }
h2 { font-size: 18px; margin: 16px 2px 8px; color: var(--deep); font-weight: 800; }
h2 small { color: var(--muted); font-weight: 500; font-size: 14px; }
.chart { display: flex; align-items: flex-end; gap: 10px; height: 130px; direction: ltr; padding-top: 16px; }
.chart div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.chart em { font-style: normal; font-size: 11px; color: var(--muted); }
.chart i { width: 100%; max-width: 44px; border-radius: 6px 6px 3px 3px; background: rgba(95,212,184,.22); min-height: 4px; }
.chart .on i { background: var(--emerald); }
.chart span { font-size: 11px; color: var(--muted); }
.client { display: block; width: 100%; text-align: right; border: 0; font: inherit; color: inherit; }
.dealrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: right; border: 0; font: inherit; color: inherit; padding: 12px 14px; margin-bottom: 6px; }
.dealrow .who { font-weight: 600; color: var(--deep); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { border: 0; background: none; color: var(--emerald); font: inherit; font-weight: 700; padding: 0 0 10px; }
.tap { cursor: pointer; }
.comm2 { font-size: 13px; color: var(--gold); font-weight: 700; }
.goldcard { position: relative; overflow: hidden; color: #2a1c00; border: 0;
  background: linear-gradient(135deg, #f4d27a 0%, #e0b046 40%, #c8922a 75%, #a9761c 100%);
  box-shadow: 0 12px 30px rgba(200,146,42,.45), 0 0 0 1px rgba(169,118,28,.35) inset; }
.goldcard .ttl { font-weight: 700; font-size: 15px; color: rgba(42,28,0,.72); }
.goldcard .v { font-size: 40px; font-weight: 900; letter-spacing: -.5px; color: #241800; }
.sc { color: var(--gold); font-weight: 800; } .tr { color: var(--emerald); font-weight: 800; }
.pair { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 15px; }
.key { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin: -4px 0 10px; }
.key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 5px; vertical-align: -1px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.name { font-weight: 700; font-size: 16px; color: var(--deep); }
.deal { display: flex; align-items: center; gap: 7px; font-size: 14.5px; padding: 3px 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: #999; }
.j { color: var(--emerald); } .a { color: var(--gold); } .t { color: var(--plum); }
.dot.j { background: var(--emerald); } .dot.a { background: var(--gold); } .dot.t { background: var(--plum); }
.what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.amt { font-weight: 600; color: var(--deep); white-space: nowrap; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: rgba(111,123,118,.14); color: var(--muted); }
.tag.w { background: rgba(201,116,26,.14); color: var(--orange); } .tag.p { background: rgba(115,92,158,.13); color: var(--plum); }
.note { font-size: 12.5px; color: var(--muted); padding: 0 14px 4px 0; }
.note.w { color: var(--orange); }
.total { display: flex; justify-content: space-between; font-weight: 800; color: var(--emerald); font-size: 16px; padding-top: 9px; border-top: 1px solid var(--line); margin-top: 6px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 10px; padding: 2px 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 0; font: inherit; font-size: 14px; font-weight: 600; padding: 7px 13px; border-radius: 999px; background: var(--card); color: var(--ink); }
.chips button.on { background: var(--fill); color: var(--gold-light); }
input.search { width: 100%; border: 0; font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 12px; background: var(--card); margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: right; color: var(--muted); font-weight: 600; font-size: 12px; padding: 4px 0 6px; }
td { padding: 7px 0; border-top: 1px solid var(--line); }
tr.on td { color: var(--emerald); font-weight: 700; }
nav {
  position: fixed; inset: auto 12px calc(env(safe-area-inset-bottom) + 12px); display: flex; gap: 2px; padding: 5px;
  background: rgba(32,38,60,.9); border-radius: 22px; backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: 0 10px 28px rgba(0,0,0,.18);
}
nav button { flex: 1; border: 0; background: none; font: inherit; font-weight: 700; font-size: 13.5px; padding: 11px 2px; border-radius: 17px; color: var(--muted); }
nav button.on { background: var(--fill); color: var(--gold-light); }
.folder { display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 15px; padding: 11px; margin: 0 0 8px; border-radius: 13px; background: var(--fill); color: var(--gold-light); }
.sheet-bg { position: fixed; inset: 0; background: rgba(5,8,18,.6); z-index: 5; display: flex; align-items: flex-end; }
.sheet { background: var(--cream); width: 100%; max-height: 86dvh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 20px); }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #3b40a0, #7350c7); color: var(--gold-light); display: grid; place-items: center; font-weight: 800; flex: none; }
.box { background: var(--card); border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; border-right: 4px solid #999; box-shadow: 0 2px 6px rgba(0,0,0,.05); }
.box.j { border-color: var(--emerald); } .box.a { border-color: var(--gold); } .box.t { border-color: var(--plum); }
.close { border: 0; background: rgba(255,255,255,.08); width: 34px; height: 34px; border-radius: 50%; font-size: 16px; color: var(--muted); }
.login { max-width: 340px; margin: 16vh auto 0; text-align: center; }
.login .logo { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px; background: linear-gradient(135deg, #3b40a0, #7350c7); display: grid; place-items: center; color: var(--gold-light); font-size: 34px; }
.login input[type=password] { width: 100%; font: inherit; font-size: 18px; text-align: center; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); margin: 16px 0 10px; direction: ltr; }
.login #face { margin-bottom: 12px; }
.login button { width: 100%; border: 0; font: inherit; font-weight: 700; font-size: 17px; padding: 14px; border-radius: 14px; background: var(--fill); color: var(--gold-light); }
.login label { display: flex; gap: 8px; justify-content: center; align-items: center; color: var(--muted); font-size: 14px; margin-top: 12px; }
.err { color: #ff8a80; min-height: 20px; font-size: 14px; margin-top: 10px; }
.stamp { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; }
.stamp button { border: 0; background: none; color: var(--muted); font: inherit; text-decoration: underline; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="logo">↗</div>
  <h1>Sales Desk</h1>
  <p class="sub">הנתונים מוצפנים. הסיסמה נשארת במכשיר הזה.</p>
  <button id="face" hidden>כניסה עם Face ID</button>
  <input id="pass" type="password" autocomplete="current-password" aria-label="סיסמה">
  <button id="go">כניסה</button>
  <label><input type="checkbox" id="remember" checked> לזכור במכשיר הזה</label>
  <div class="err" id="err"></div>
</div>
<main id="app" hidden>
  <header>
    <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
    <div class="tools">
      <button class="icon" id="search" aria-label="חיפוש"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
      <button class="icon" id="refresh" aria-label="רענון"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg></button>
      <select class="month" id="month" aria-label="חודש"></select></div>
  </header>
  <div class="card faceAsk" id="faceAsk" hidden><div class="row"><div><b>כניסה מהירה עם Face ID</b><div class="small">בלי להקליד סיסמה בכל כניסה</div></div>
    <button id="enableFace2">הפעלה</button></div><button class="later" id="faceLater">לא עכשיו</button></div>
  <section id="view"></section>
  <div class="stamp"><span id="stamp"></span> · <button id="lock">נעילה</button><span id="faceSet" hidden> · <button id="enableFace">הפעלת Face ID</button></span></div>
</main>
<div class="find" id="find" hidden><div class="panel">
  <div class="findbar"><input id="findq" type="search" placeholder="שם, ת״ז או מקור" autocomplete="off" enterkeyhint="search"><button class="cancel" id="findClose">ביטול</button></div>
  <div class="results" id="findResults"></div></div></div>
<nav id="nav" hidden>
  <button data-tab="home">בית</button><button data-tab="comm">עמלות</button><button data-tab="clients">לקוחות</button><button data-tab="deals">עסקאות</button>
</nav>
<div id="sheet" class="sheet-bg" hidden><div class="sheet" id="sheetBody"></div></div>
<script src="engine.js"></script>
<script>
// An app, not a web page: no pinch zoom (Safari ignores the viewport setting on its own); double-tap zoom is off through touch-action.
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

const $ = id => document.getElementById(id);
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const monthName = m => { const [a, b] = (m || "").split("/"); return MONTHS[+a - 1] ? `${MONTHS[+a - 1]} 20${b}` : m; };
const shortMonth = m => MONTHS[+(m || "").split("/")[0] - 1] || m;
const money = v => v == null ? "" : Math.round(v).toLocaleString("he-IL") + " ₪";   // whole shekels, always
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = a => a === "הצטרפות" ? "j" : a === "מינוי סוכן" ? "a" : a === "ניוד" ? "t" : "";
const KEY = "salesdesk.keys";
const PAGE = "539271";   // the page's own version, filled in when the Mac builds the site: shows which copy the phone runs
let state = null, month = "", tab = "home", query = "", kind = "הכול", onlyOpen = false;

// ---------- decryption: PBKDF2 -> AES-CBC key + HMAC key; the MAC is checked before anything is decrypted
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKeys(pass, env) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(env.salt), iterations: env.iterations }, base, 512));
  return { enc: bits.slice(0, 32), mac: bits.slice(32), salt: env.salt };
}
async function open(env, keys) {
  const iv = b64(env.iv), ct = b64(env.ct);
  const macKey = await crypto.subtle.importKey("raw", keys.mac, { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
  if (!await crypto.subtle.verify("HMAC", macKey, b64(env.mac), signed)) throw new Error("bad");
  const encKey = await crypto.subtle.importKey("raw", keys.enc, "AES-CBC", false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, encKey, ct)));
}
const hex = u => [...u].map(x => x.toString(16).padStart(2, "0")).join("");
const unhex = s => Uint8Array.from(s.match(/../g).map(h => parseInt(h, 16)));

// ---------- Face ID: a passkey on this phone. Its PRF secret (released only after Face ID) locks the unlock keys,
// so the keys stored on the phone are useless without the owner's face. Nothing about it leaves the phone.
const FKEY = "salesdesk.faceid";
const PRF_SALT = new TextEncoder().encode("sales-desk-faceid-v1");
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const b64u = u => btoa(String.fromCharCode(...u)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const faceSaved = () => { try { return JSON.parse(localStorage.getItem(FKEY) || "null"); } catch (e) { return null; } };
const prfAes = secret => crypto.subtle.importKey("raw", new Uint8Array(secret).slice(0, 32), "AES-GCM", false, ["encrypt", "decrypt"]);
async function prfSecret(id) {
  const a = await navigator.credentials.get({ publicKey: { challenge: rand(32), rpId: location.hostname, userVerification: "required",
    allowCredentials: [{ type: "public-key", id }], extensions: { prf: { eval: { first: PRF_SALT } } } } });
  const r = (a.getClientExtensionResults() || {}).prf;
  if (!r || !r.results || !r.results.first) throw new Error("noprf");
  return r.results.first;
}
let faceKeys = null, facePending = null;   // the open session's keys, kept in memory only while enabling
async function lockWithFace(id, secret) {
  const k = await prfAes(secret), iv = rand(12);
  const plain = new TextEncoder().encode(JSON.stringify({ enc: hex(faceKeys.enc), mac: hex(faceKeys.mac) }));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, plain));
  localStorage.setItem(FKEY, JSON.stringify({ id: b64u(id), iv: b64u(iv), ct: b64u(ct), salt: faceKeys.salt }));
  facePending = null;
}
async function enableFace() {
  const b = $("enableFace");
  try {
    if (facePending) { await lockWithFace(facePending, await prfSecret(facePending)); }
    else {
      const cred = await navigator.credentials.create({ publicKey: { challenge: rand(32), rp: { name: "Sales Desk", id: location.hostname },
        user: { id: rand(16), name: "Sales Desk", displayName: "Sales Desk" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", residentKey: "required", userVerification: "required" },
        extensions: { prf: { eval: { first: PRF_SALT } } } } });
      const id = new Uint8Array(cred.rawId), r = (cred.getClientExtensionResults() || {}).prf || {};
      if (r.enabled === false) throw new Error("noprf");

    <div class="chips" style="margin:0 0 10px;padding:0"><span class="tag">${rows.length} מוצרים</span>
      ${premium ? `<span class="tag num" style="color:var(--emerald)">פרמיה ${money(premium)}</span>` : ""}
      ${withComm ? `<span class="tag num" style="color:var(--gold)">היקף ${cmoney(scope)}</span><span class="tag num" style="color:var(--gold)">נפרעים ${cmoney(trailing)}</span>` : ""}
      ${c.sheetPending ? '<span class="tag p">לא בגיליון</span>' : ""}<span class="tag">${c.hasFolder ? c.pdfCount + " מסמכים" : "אין תיקייה"}</span></div>
    ${c.folderRel ? `<a class="folder" href="${esc(filesLink(c.folderRel))}">📁 פתיחת התיקייה בקבצים</a>` : ""}
    ${rows.map(r => `<div class="box ${cls(r.action)}"><div class="row"><span><b style="color:var(--deep)">${esc(r.product || "מוצר לא כתוב")}</b>
        <span class="${cls(r.action)}" style="font-weight:600"> ${esc(r.action)}</span></span><span class="amt num">${esc(amount(r))}</span></div>
      <div class="small" style="font-size:13.5px">${esc([company(r), r.person].filter(Boolean).join(" · "))}</div>
      ${[r.cancels && "ביטול: " + r.cancels, r.lien && "שעבוד: " + r.lien, r.premium != null || r.deposit != null ? r.amount != null && "צבירה: " + money(r.amount) : null, r.note,
         withComm && r.commission.assumed].filter(Boolean).map(n => `<div class="small">${esc(n)}</div>`).join("")}
      ${withComm ? `<div class="comm2 num">${r.commission.missing ? esc(r.commission.missing) : "היקף " + cmoney(r.commission.scope) + " · נפרעים " + cmoney(r.commission.trailing)}</div>` : ""}
      ${question(r) ? `<div class="small" style="color:var(--orange)">לא ודאי: ${esc(question(r))}</div>` : ""}</div>`).join("") || '<div class="small">ללא מכירה</div>'}
    ${c.audit.map(a => `<div class="box"><div class="small" style="color:var(--orange)">לבדיקה: ${esc(a)}</div></div>`).join("")}
    ${c.followup ? `<div class="small" style="margin-top:8px">🔔 ${esc(c.followup)}</div>` : ""}`;
  $("sheet").hidden = false;
}

function dealSheet(id, withComm) {
  const r = state.rows.find(x => x.id === id); if (!r) return;
  const c = state.clients.find(x => x.id === r.clientId) || {};
  const line = (k, v) => v == null || v === "" ? "" : `<div class="row" style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)"><span class="small">${k}</span><b>${esc(String(v))}</b></div>`;
  $("sheetBody").innerHTML = `<div class="row" style="margin-bottom:12px"><div><div class="name" style="font-size:19px">${esc(r.product || "מוצר לא כתוב")}
      <span class="${cls(r.action)}"> ${esc(r.action)}</span></div><div class="small">${esc(r.client)} · ${esc(lead(c))} · ${monthName(r.month)}</div></div>
      <button class="close" id="closeSheet" aria-label="סגירה">✕</button></div>
    <div class="card">${line("חברה", r.fromCompany && r.company ? r.fromCompany + " ← " + r.company : r.company)}${line("על שם", r.person)}
      ${line("פרמיה", r.premium != null ? money(r.premium) : null)}${line("הפקדה", r.deposit != null ? money(r.deposit) : null)}
      ${line("צבירה", r.amount != null ? money(r.amount) : null)}${line("שכר", r.salary != null ? money(r.salary) : null)}
      ${line("ביטול", r.cancels)}${line("שעבוד", r.lien)}${line("הערה", r.note)}${question(r) ? line("לא ודאי", question(r)) : ""}
      ${withComm ? line("סוג עמלה", r.commission.label) + (r.commission.missing ? line("עמלה", r.commission.missing)
        : line("היקף", cmoney(r.commission.scope)) + line("נפרעים", cmoney(r.commission.trailing))) + line("הנחה", r.commission.assumed) : ""}</div>
    <button class="card client" data-client="${esc(r.clientId)}" data-comm-card="${withComm ? 1 : ""}" style="margin-top:4px"><b>לכרטיס הלקוח ←</b></button>`;
  $("sheet").hidden = false;
}

const TITLES = { home: ["", "מצב חודשי"], clients: ["לקוחות", ""], deals: ["עסקאות", ""], comm: ["העמלות שלי", ""] };
function greeting() { const h = new Date().getHours(); return (h < 5 ? "לילה טוב" : h < 12 ? "בוקר טוב" : h < 17 ? "צהריים טובים" : h < 21 ? "ערב טוב" : "לילה טוב") + ", אדיר"; }
function render() {
  $("title").textContent = TITLES[tab][0] || greeting(); $("subtitle").textContent = TITLES[tab][1];
  $("month").innerHTML = state.months.slice().reverse().map(m => `<option value="${m.month}" ${m.month === month ? "selected" : ""}>${monthName(m.month)}</option>`).join("");
  $("view").innerHTML = { home, clients, deals, comm }[tab]();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("stamp").textContent = "Mac: " + state.generatedAt.replace("T", " ").slice(5, 16) + (liveNote ? " · " + liveNote : "") + " · v" + PAGE;
}

$("month").addEventListener("change", e => { month = e.target.value; render(); });
$("nav").addEventListener("click", e => { const t = e.target.dataset.tab; if (t) { tab = t; commView = "summary"; render(); scrollTo(0, 0); } });
$("view").addEventListener("click", e => {
  const at = sel => e.target.closest(sel);
  let x;
  if ((x = at("[data-cclient]"))) return clientSheet(x.dataset.cclient, true);
  if ((x = at("[data-cdeal]"))) return dealSheet(x.dataset.cdeal, true);
  if ((x = at("[data-deal]"))) return dealSheet(x.dataset.deal, false);
  if ((x = at("[data-pick]"))) { month = x.dataset.pick; return render(); }   // the chart only changes the month, like the menu at the top
  if ((x = at("[data-cmonth]"))) { month = x.dataset.cmonth; commView = "month"; render(); return scrollTo(0, 0); }
  if ((x = at("[data-comm]"))) { commView = x.dataset.comm; render(); return scrollTo(0, 0); }
  if ((x = at("[data-client]"))) return clientSheet(x.dataset.client, false);
});
$("search").addEventListener("click", findOpen);
$("findq").addEventListener("input", findRender);
$("findq").addEventListener("keydown", e => { if (e.key === "Enter") { const first = $("findResults").querySelector("[data-found]"); if (first) first.click(); } });
$("find").addEventListener("click", e => {
  const hit = e.target.closest("[data-found]");
  if (hit) { findClose(); return clientSheet(hit.dataset.found, tab === "comm"); }   // the card as this tab shows it
  if (e.target.id === "find" || e.target.id === "findClose") findClose();
});
$("sheet").addEventListener("click", e => {
  const card = e.target.closest("[data-client]");
  if (card) return clientSheet(card.dataset.client, !!card.dataset.commCard);
  if (e.target.id === "sheet" || e.target.id === "closeSheet") $("sheet").hidden = true;
});
$("go").addEventListener("click", () => load($("pass").value));
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") load($("pass").value); });
$("lock").addEventListener("click", () => { localStorage.removeItem(KEY); state = null; faceKeys = null; showLogin(""); });
$("face").addEventListener("click", () => load("", true));
$("enableFace").addEventListener("click", enableFace);
$("enableFace2").addEventListener("click", enableFace);
$("faceLater").addEventListener("click", () => { localStorage.setItem("salesdesk.faceLater", "1"); $("faceAsk").hidden = true; });
$("refresh").addEventListener("click", async () => { const b = $("refresh"); b.classList.add("spin"); await load(""); b.classList.remove("spin"); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && state) load(""); });
load("", faceSaved() && window.PublicKeyCredential ? "auto" : false);
</script>
</body>
</html>
