.avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #4b3fc4, #7b6cf6); color: var(--gold-light); display: grid; place-items: center; font-weight: 800; flex: none; }

[hidden] { display: none !important; }
* { scrollbar-width: none; -webkit-tap-highlight-color: transparent; } *::-webkit-scrollbar { display: none; width: 0; height: 0; }

#pager { position: relative; } #view { will-change: transform; } #peek { position: absolute; left: 0; right: 0; top: 0; will-change: transform; pointer-events: none; }
/* loading: grey cards that shimmer until the first screen is ready; pull down from the top to refresh */
.boot { padding: calc(env(safe-area-inset-top) + 70px) 14px 0; } .boot i { display: block; height: 130px; border-radius: 22px; margin-bottom: 12px; background: linear-gradient(100deg, rgba(255,255,255,.05) 30%, rgba(255,255,255,.12) 50%, rgba(255,255,255,.05) 70%) 0 0 / 200% 100%; animation: shimmer 1.3s linear infinite; }

</head>
<body>
<div id="boot" class="boot"><i></i><i></i><i></i></div>
<div id="ptr" class="ptr" aria-hidden="true">↓</div>
<div id="login" class="login" hidden>
  <img class="logo" src="icon-192.png" alt="Clarus" width="72" height="72">
  <h1>Clarus</h1>
  <p class="sub">הנתונים מוצפנים. הסיסמה נשארת במכשיר הזה.</p>
  <button id="face" hidden>כניסה עם Face ID</button>
  <input id="pass" type="password" autocomplete="current-password" aria-label="סיסמה">
  <button id="go">כניסה</button>
  <label><input type="checkbox" id="remember" checked> לזכור במכשיר הזה</label>
  <div class="err" id="err"></div>
</div>
<main id="app" hidden>
  <header>
    <div><h1 id="title"></h1></div>
    <div class="tools">
      <button class="icon" id="search" aria-label="חיפוש"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
      <select class="month" id="month" aria-label="חודש"></select></div>
    <div class="sub" id="subtitle"></div>
  </header>
  <div class="card faceAsk" id="faceAsk" hidden><div class="row"><div><b>כניסה מהירה עם Face ID</b><div class="small">בלי להקליד סיסמה בכל כניסה</div></div>
    <button id="enableFace2">הפעלה</button></div><button class="later" id="faceLater">לא עכשיו</button></div>
  <div id="pager"><section id="view"></section><section id="peek" aria-hidden="true" hidden></section></div>
  <div class="stamp"><span id="stamp"></span> · <span id="vp"></span> · <button id="lock">נעילה</button><span id="faceSet" hidden> · <button id="enableFace">הפעלת Face ID</button></span></div>
</main>
<div class="find" id="find" hidden><div class="panel">
  <div class="findbar"><input id="findq" type="search" placeholder="שם, ת״ז או מקור" autocomplete="off" enterkeyhint="search"><button class="cancel" id="findClose">ביטול</button></div>
  <div class="results" id="findResults"></div></div></div>
<nav id="nav" hidden>
  <button data-tab="home">ראשי</button><button data-tab="ops">תפעול</button><button data-tab="clients">לקוחות</button><button data-tab="comm">עמלות</button>
</nav>
<div id="sheet" class="sheet-bg" hidden><div class="sheet back" id="sheetBack" hidden></div><div class="sheet" id="sheetBody"></div></div>
<script src="engine.js"></script>
<script>
// An app, not a web page: no pinch zoom (Safari ignores the viewport setting on its own); double-tap zoom is off through touch-action.
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

const $ = id => document.getElementById(id);
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const monthName = m => { const [a, b] = (m || "").split("/"); return MONTHS[+a - 1] ? `${MONTHS[+a - 1]} 20${b}` : m; };
const shortMonth = m => MONTHS[+(m || "").split("/")[0] - 1] || m;
const money = v => v == null ? "" : Math.round(v).toLocaleString("he-IL") + " ₪";   // whole shekels, always
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = a => a === "הצטרפות" ? "j" : a === "מינוי סוכן" ? "a" : a === "ניוד" ? "t" : "";
const KEY = "salesdesk.keys";
// The remembered unlock key is kept twice (localStorage and IndexedDB): a phone that clears one of them still finds the other.
const idb = (mode, fn) => new Promise(res => { try {
  const r = indexedDB.open("salesdesk", 1); r.onupgradeneeded = () => r.result.createObjectStore("k");
  r.onsuccess = () => { const t = r.result.transaction("k", mode), q = fn(t.objectStore("k")); t.oncomplete = () => res(q && q.result); t.onerror = () => res(null); };
  r.onerror = () => res(null); } catch (e) { res(null); } });
const forget = () => { try { localStorage.removeItem(KEY); } catch (e) {} return idb("readwrite", st => st.delete("keys")); };
// ---------- pairing: the Mac shows a QR code whose link carries a device key after "#" (a browser never sends that part anywhere). It is kept on this phone and mixed into the unlock key.
const DKEY = "salesdesk.dk";
(() => {
  const m = /^#k=([0-9a-f]{64})$/.exec(location.hash);
  if (!m) return;
  try { localStorage.setItem(DKEY, m[1]); localStorage.removeItem("salesdesk.keys"); localStorage.removeItem("salesdesk.faceid"); } catch (e) {}
  history.replaceState(null, "", location.pathname + location.search);   // the key is not left in the address bar or the history
})();
const deviceKey = () => { try { return localStorage.getItem(DKEY) || ""; } catch (e) { return ""; } };
const PAGE = "233dea";   // the page's own version, filled in when the Mac builds the site: shows which copy the phone runs
let state = null, month = "", tab = "home", query = "", kind = "הכול", onlyOpen = false;

// ---------- decryption: PBKDF2 -> AES-CBC key + HMAC key; the MAC is checked before anything is decrypted
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKeys(pass, env) {
  let material = pass;
  if (env.dk) { const dk = deviceKey(); if (!dk) throw new Error("nodk"); material = pass + "\u0000" + dk; }   // same mixing as the Mac: passphrase, one zero byte, device key
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(material), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(env.salt), iterations: env.iterations }, base, 512));
  return { enc: bits.slice(0, 32), mac: bits.slice(32), salt: env.salt };
}
async function open(env, keys) {
  const iv = b64(env.iv), ct = b64(env.ct);
  const macKey = await crypto.subtle.importKey("raw", keys.mac, { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
  if (!await crypto.subtle.verify("HMAC", macKey, b64(env.mac), signed)) throw new Error("bad");
  const encKey = await crypto.subtle.importKey("raw", keys.enc, "AES-CBC", false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, encKey, ct)));
}
const hex = u => [...u].map(x => x.toString(16).padStart(2, "0")).join("");
const unhex = s => Uint8Array.from(s.match(/../g).map(h => parseInt(h, 16)));

// ---------- Face ID: a passkey on this phone. Its PRF secret (released only after Face ID) locks the unlock keys,
// so the keys stored on the phone are useless without the owner's face. Nothing about it leaves the phone.
const FKEY = "salesdesk.faceid";
const PRF_SALT = new TextEncoder().encode("sales-desk-faceid-v1");
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const b64u = u => btoa(String.fromCharCode(...u)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const faceSaved = () => { try { return JSON.parse(localStorage.getItem(FKEY) || "null"); } catch (e) { return null; } };
const prfAes = secret => crypto.subtle.importKey("raw", new Uint8Array(secret).slice(0, 32), "AES-GCM", false, ["encrypt", "decrypt"]);
async function prfSecret(id) {
  const a = await navigator.credentials.get({ publicKey: { challenge: rand(32), rpId: location.hostname, userVerification: "required",
    allowCredentials: [{ type: "public-key", id }], extensions: { prf: { eval: { first: PRF_SALT } } } } });
  const r = (a.getClientExtensionResults() || {}).prf;
  if (!r || !r.results || !r.results.first) throw new Error("noprf");
  return r.results.first;
}
let faceKeys = null, facePending = null;   // the open session's keys, kept in memory only while enabling
async function lockWithFace(id, secret) {
  const k = await prfAes(secret), iv = rand(12);
  const plain = new TextEncoder().encode(JSON.stringify({ enc: hex(faceKeys.enc), mac: hex(faceKeys.mac) }));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, plain));
  localStorage.setItem(FKEY, JSON.stringify({ id: b64u(id), iv: b64u(iv), ct: b64u(ct), salt: faceKeys.salt }));
  facePending = null;
}
async function enableFace() {
  const b = $("enableFace");
  try {
    if (facePending) { await lockWithFace(facePending, await prfSecret(facePending)); }
    else {
      const cred = await navigator.credentials.create({ publicKey: { challenge: rand(32), rp: { name: "Clarus", id: location.hostname },
        user: { id: rand(16), name: "Clarus", displayName: "Clarus" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", residentKey: "required", userVerification: "required" },
        extensions: { prf: { eval: { first: PRF_SALT } } } } });
      const id = new Uint8Array(cred.rawId), r = (cred.getClientExtensionResults() || {}).prf || {};
      if (r.enabled === false) throw new Error("noprf");
      if (r.results && r.results.first) await lockWithFace(id, r.results.first);
      else { facePending = id; b.textContent = $("enableFace2").textContent = "אישור אחרון"; return; }   // a second tap: the phone wants a fresh gesture
    }
    $("faceSet").hidden = true; $("faceAsk").hidden = true; liveNote = "Face ID הופעל"; render();
  } catch (e) {
    b.textContent = e.message === "noprf" ? "Face ID לא נתמך כאן" : "הפעלת Face ID";
    liveNote = "Face ID: " + (e.name || "") + " " + (e.message || ""); render();   // the reason is shown, so a phone that refuses can be diagnosed
  }
}
async function keysFromFace(saved) {
  const k = await prfAes(await prfSecret(unb64u(saved.id)));
  const o = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64u(saved.iv) }, k, unb64u(saved.ct))));
  return { enc: unhex(o.enc), mac: unhex(o.mac), salt: saved.salt };
}

let lastCt = "", entered = false, hiddenAt = 0;
async function load(pass, useFace, force) {
  if (!window.crypto || !crypto.subtle) { showLogin("הדפדפן חוסם פענוח בכתובת לא מאובטחת. צריך כתובת https."); return; }
  let env;
  try { env = await (await fetch("snapshot.enc.json", { cache: "no-store" })).json(); }
  catch (e) { showLogin("לא הצלחתי להביא את הנתונים. בדוק חיבור."); return; }
  if (state && !force && !pass && useFace !== true && env.ct === lastCt) return;   // same snapshot as on screen: leave the screen (and its scroll) alone
  let keys = null;
  try {
    let saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!saved) { const b = await idb("readonly", st => st.get("keys")); if (b) { saved = JSON.parse(b); localStorage.setItem(KEY, b); } }
    const face = faceSaved();
    if (pass) keys = await deriveKeys(pass, env);
    // "Remember on this device" wins: the app opens straight away. Face ID is for when it is not remembered (or after "נעילה").
    else if (saved && saved.salt === env.salt && useFace !== true) keys = { enc: unhex(saved.enc), mac: unhex(saved.mac), salt: saved.salt };
    else if (useFace && face) {
      try { keys = await keysFromFace(face); }
      catch (e) { showLogin(e.name === "NotAllowedError" || useFace === "auto" ? "" : "Face ID לא זמין. אפשר להיכנס בסיסמה."); return; }
    }
    else if (faceKeys && faceKeys.salt === env.salt) keys = faceKeys;   // back from the background: same session, no new prompt
    else if (saved && saved.salt === env.salt) keys = { enc: unhex(saved.enc), mac: unhex(saved.mac), salt: saved.salt };
    if (!keys) {
      // say why the phone asks: nothing remembered, or what it remembered no longer fits this site's copy
      let why = ""; try { why = !saved ? "אין מפתח שמור במכשיר (" + (deviceKey() ? "המכשיר מזווג" : "לא מזווג") + ")" : saved.salt !== env.salt ? "המפתח השמור ישן, צריך כניסה אחת" : ""; } catch (e) {}
      showLogin(pass ? "" : why); return;
    }
    state = await open(env, keys);
  } catch (e) {
    if (e && e.message === "nodk") { showLogin("האייפון עוד לא מזווג. פתח את הקישור מקוד ה־QR שמוצג על מסך המחשב."); return; }
    if (pass) await forget();   // a remembered key is dropped only after a wrong passphrase was typed, never on a hiccup
    if (useFace === true) localStorage.removeItem(FKEY);   // the passphrase changed since Face ID was set: it is set again after the next login
    showLogin(pass ? "סיסמה שגויה" : useFace === true ? "הסיסמה הוחלפה. צריך להיכנס שוב בסיסמה." : "המפתח השמור לא פתח את הנתונים (" + (e && e.message || "שגיאה") + ")");
    return;
  }
  faceKeys = keys; lastCt = env.ct;
  const offerFace = false;   // the phone remembers the unlock key by itself now: no Face ID offer (the code stays for a phone that already set it up)
  $("faceSet").hidden = !offerFace;
  $("faceAsk").hidden = !(offerFace && !localStorage.getItem("salesdesk.faceLater"));
  let kept = "";
  if ((pass || useFace) && $("remember").checked) {
    const js = JSON.stringify({ enc: hex(keys.enc), mac: hex(keys.mac), salt: keys.salt });
    try { localStorage.setItem(KEY, js); } catch (e) {}
    await idb("readwrite", st => st.put(js, "keys"));
    kept = localStorage.getItem(KEY) === js ? "" : (await idb("readonly", st => st.get("keys"))) === js ? "" : "המפתח לא נשמר במכשיר";
  }
  state.rows = state.rows.filter(r => !r.test); state.clients = state.clients.filter(c => !c.test);
  if (!state.months.some(m => m.month === month)) month = state.months[state.months.length - 1].month;
  $("boot").hidden = true; $("login").hidden = true; $("app").hidden = false; $("nav").hidden = false; $("pass").value = "";
  liveNote = kept;
  const firstOpen = !entered; entered = true;
  render(); if (firstOpen) enter("month");
  live();
}

// ---------- the live sheet: the phone reads it by itself (read-only key), so it is current even with the Mac off
let liveNote = "";
async function live() {
  if (!state || !state.live || !state.sheet || typeof Engine === "undefined") return;
  const d = new Date(), today = String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getFullYear() % 100).padStart(2, "0");
  // The phone's engine must reproduce the Mac's own figures before it is trusted with new rows.
  if (!Engine.agrees(state, today)) { liveNote = "מוצג מצב מה-Mac (החישוב באייפון לא תואם)"; render(); return; }
  liveNote = "בודק את הגיליון…"; render();
  try {
    const res = await fetch(state.live.url, { method: "POST", body: JSON.stringify({ token: state.live.token, action: "read" }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error);
    const r = Engine.applyLive(state, out.rows, today);
    if (r.error) liveNote = "מוצג מצב מה-Mac (" + r.error + ")";
    else {
      state = r.state;
      state.rows = state.rows.filter(x => !x.test); state.clients = state.clients.filter(c => !c.test);
      const t = new Date().toTimeString().slice(0, 5);
      liveNote = "גיליון: עודכן " + t + (r.changed ? ` · ${r.changed} שורות חדשות נקראו באייפון` : "");
    }
  } catch (e) { liveNote = "אין חיבור לגיליון · מוצג מצב מה-Mac"; }
  if (!state.months.some(m => m.month === month)) month = state.months[state.months.length - 1].month;
  render();
}
function showLogin(msg) {
  $("boot").hidden = true;
  $("login").hidden = false; $("app").hidden = true; $("nav").hidden = true; $("err").textContent = msg;
  $("face").hidden = !(faceSaved() && window.PublicKeyCredential);
}

// ---------- pieces
function amount(r) {
  if (r.premium != null) return money(r.premium);
  if (r.deposit != null) return "הפקדה " + money(r.deposit);
  if (r.amount != null) return "צבירה " + money(r.amount);
  if (r.salary != null) return "שכר " + money(r.salary);
  return "";
}
const question = r => r.commission.critical && r.commission.missing ? r.commission.missing : (!r.sure ? (r.unsure || "הפענוח לא ודאי") : null);
